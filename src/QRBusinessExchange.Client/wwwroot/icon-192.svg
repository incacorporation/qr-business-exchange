<!-- Generate this SVG as PNG at 192x192 using an online converter or tool -->
<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" fill="#4A90E2"/>
  
  <!-- QR Code representation -->
  <g transform="translate(96, 96)">
    <!-- White background for QR -->
    <rect x="-70" y="-70" width="140" height="140" fill="white" rx="8"/>
    
    <!-- QR Code squares -->
    <rect x="-60" y="-60" width="50" height="50" fill="#4A90E2"/>
    <rect x="10" y="-60" width="50" height="50" fill="#4A90E2"/>
    <rect x="-60" y="10" width="50" height="50" fill="#4A90E2"/>
    
    <!-- Inner white squares -->
    <rect x="-50" y="-50" width="30" height="30" fill="white"/>
    <rect x="20" y="-50" width="30" height="30" fill="white"/>
    <rect x="-50" y="20" width="30" height="30" fill="white"/>
    
    <!-- Center dots -->
    <rect x="-40" y="-40" width="10" height="10" fill="#4A90E2"/>
    <rect x="30" y="-40" width="10" height="10" fill="#4A90E2"/>
    <rect x="-40" y="30" width="10" height="10" fill="#4A90E2"/>
    
    <!-- Data pattern -->
    <rect x="10" y="10" width="15" height="15" fill="#4A90E2"/>
    <rect x="30" y="10" width="15" height="15" fill="#4A90E2"/>
    <rect x="10" y="30" width="15" height="15" fill="#4A90E2"/>
    <rect x="30" y="30" width="15" height="15" fill="#4A90E2"/>
    <rect x="10" y="45" width="15" height="15" fill="#4A90E2"/>
    <rect x="45" y="10" width="15" height="15" fill="#4A90E2"/>
    <rect x="45" y="30" width="15" height="15" fill="#4A90E2"/>
    <rect x="45" y="45" width="15" height="15" fill="#4A90E2"/>
  </g>
</svg>
